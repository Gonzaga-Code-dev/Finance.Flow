<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FinanceFlow</title>
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FinanceFlow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f6f7f9;--sf:#fff;--s2:#eef0f4;--bd:#e5e7eb;--tx:#16181d;--mu:#6b7280;--bl:#2563eb;--gr:#16a34a;--rd:#dc2626;--am:#d97706}
body.dark{--bg:#0f1117;--sf:#1a1d26;--s2:#252836;--bd:#2d3748;--tx:#f0f4ff;--mu:#94a3b8}
html,body{height:100%}
body{font:14px/1.45 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);-webkit-tap-highlight-color:transparent}
.app{max-width:720px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font-size:19px;font-weight:700;color:var(--bl);letter-spacing:-.5px}.brand span{color:var(--tx)}
.btn{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:8px 12px;cursor:pointer;color:var(--mu);font-size:12px;font-weight:500}
.menu{position:relative}.menu summary{list-style:none}.menu summary::-webkit-details-marker{display:none}
.menu div{position:absolute;right:0;top:38px;background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:6px;display:grid;gap:2px;z-index:20;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.menu button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px}.menu button:hover{background:var(--s2)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav b{text-transform:capitalize;font-size:15px}.nav button{width:40px;height:36px;font-size:18px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.hero{background:var(--tx);color:var(--bg);border:0}
.hero .lb{font-size:12px;opacity:.7}.big{font-size:38px;font-weight:700;letter-spacing:-1.5px;margin:2px 0}.big.neg{color:#fca5a5}
.hero .sub{font-size:12px;opacity:.7}
.bar{height:6px;background:var(--s2);border-radius:6px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--bl);border-radius:6px}
.hero .bar{background:rgba(128,128,128,.35)}.hero .bar i{background:#93c5fd}
.row{display:flex;justify-content:space-between;font-size:12px}
h2{font-size:13px;font-weight:600;margin-bottom:10px}
.al{display:flex;gap:12px;padding:12px;background:var(--s2);border-radius:10px;margin-bottom:8px}
.al .ic{font-size:20px}.al b{display:block;font-size:13px}.al small{color:var(--mu)}
.al button,.acts button{margin-top:8px;margin-right:6px;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:12px}
.ok{color:var(--gr)}.mid{color:var(--am)}.no,.rd{color:var(--rd)}.gr{color:var(--gr)}
.cat{margin-bottom:12px}.cat .row span:last-child{color:var(--mu)}.cat .bar{margin:5px 0 0}
details.card summary{cursor:pointer;font-weight:600;font-size:13px}
details.card[open] summary{margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu)}
input,select{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:10px 12px;outline:0;width:100%;font-size:16px}
input:focus,select:focus{border-color:var(--bl)}
.go{background:var(--bl);color:#fff;border:0;border-radius:8px;padding:11px;font-weight:600;cursor:pointer;width:100%;margin-top:8px}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.ti{width:34px;height:34px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.in{flex:1;min-width:0}.d{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{font-size:11px;color:var(--mu);display:flex;gap:6px;align-items:center}
.m select{width:auto;padding:1px 4px;font-size:11px;border-radius:6px}
.tx>b{white-space:nowrap;font-size:13px}
.x{background:none;border:0;font-size:20px;color:var(--mu);cursor:pointer;padding:4px 8px}
.empty{text-align:center;color:var(--mu);padding:24px 0}
.quick{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--bd);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:30}
.quick div{max-width:720px;margin:0 auto;display:flex;gap:8px}
.quick button{border:0;border-radius:8px;width:46px;cursor:pointer;background:var(--s2);font-size:18px}
.quick .add{background:var(--bl);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,8px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:40;opacity:0;pointer-events:none;transition:.25s;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">Finance<span>Flow</span></div>
    <details class="menu"><summary class="btn">Mais</summary><div>
      <button onclick="$('fi').click()">Importar extrato (CSV, OFX)</button>
      <button onclick="backup()">Backup (JSON)</button>
      <button onclick="$('fr').click()">Restaurar backup</button>
      <button onclick="exportCSV()">Exportar CSV</button>
      <button onclick="dark()">Modo escuro</button>
    </div></details>
    <input type="file" id="fi" accept=".csv,.ofx,.txt" hidden>
    <input type="file" id="fr" accept=".json" hidden>
  </div>

  <div class="nav"><button class="btn" onclick="shift(-1)" aria-label="Mês anterior">‹</button><b id="mon"></b><button class="btn" onclick="shift(1)" aria-label="Próximo mês">›</button></div>

  <div class="card hero" id="hero"></div>
  <div id="pend"></div>
  <div class="card" id="att" hidden></div>
  <div class="card" id="cats" hidden></div>

  <details class="card"><summary>Posso comprar?</summary>
    <div class="fg"><label>Item<input id="pi" placeholder="Tênis"></label><label>Valor (R$)<input id="pv" inputmode="decimal" placeholder="380"></label></div>
    <button class="go" onclick="ask()">Perguntar</button>
    <div id="pr" style="margin-top:12px"></div>
  </details>

  <details class="card"><summary>Orçamentos do mês</summary>
    <div class="fg" id="bud"></div>
  </details>

  <div class="card">
    <h2>Lançamentos</h2>
    <input id="search" placeholder="Buscar lançamento" oninput="renderList()">
    <div id="list"></div>
  </div>
</div>

<div class="quick"><div>
  <input id="q" placeholder="mercado 240  ·  +salário 3000" enterkeyhint="send" onkeydown="if(event.key==='Enter')quick()">
  <button id="mic" aria-label="Falar">🎤</button>
  <button class="add" onclick="quick()" aria-label="Adicionar">+</button>
</div></div>
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const fmt=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

const CE={contas:['🏠','Contas fixas'],alimentacao:['🍽','Alimentação'],transporte:['🚗','Transporte'],saude:['❤️','Saúde'],lazer:['🎮','Lazer'],estudos:['📚','Estudos'],investimentos:['💼','Investimentos'],outros:['📦','Outros']};
const CI={salario:['💵','Salário'],salario_pj:['🧾','Salário PJ'],extra:['➕','Outras entradas']};
const ALL={...CE,...CI};
const KW=[
 ['alimentacao',/mercado|super|ifood|ifd|padaria|restaurante|lanche|pizza|burger|cafe|acougue|hortifruti|rappi|almoco|jantar|feira/],
 ['transporte',/uber|\b99|combust|gasolina|posto|estaciona|onibus|metro|pedagio|shell|ipiranga/],
 ['saude',/farm|drogasil|drogaria|raia|medic|consulta|plano de saude|academia|dentista|exame/],
 ['lazer',/cinema|cinemark|netflix|spotify|show|ingresso|steam|game|viagem|prime|disney|hbo|youtube|bar /],
 ['estudos',/curso|udemy|alura|livro|faculdade|escola|mensalidade/],
 ['investimentos',/invest|aporte|tesouro|cdb|acoes|cripto|fii/],
 ['contas',/aluguel|imobili|condom|luz|energia|agua|internet|vivo|claro|tim |iptu|boleto|financ|fatura|emprest/]];
const INC=/recebi|salario|ganhei|entrada|deposito|freela|pagamento recebido|pix recebido/;
const AMT=/(?:r\$\s*)?-?\d{1,3}(?:\.\d{3})+(?:,\d{1,2})?|(?:r\$\s*)?-?\d+(?:[.,]\d{1,2})?/i;

let S={tx:[],bud:{},rules:{},dis:{},pend:null},M=today().slice(0,7),ASK=null;
try{
  const r=localStorage.getItem('ff2');
  if(r)S={...S,...JSON.parse(r)};
  else S.tx=JSON.parse(localStorage.getItem('ff_transactions')||'[]').map(t=>({id:t.id,d:t.date,desc:t.desc,c:Math.round(t.amount*100),t:t.type==='income'?'i':'o',cat:t.category}));
}catch(e){}
const save=()=>{try{localStorage.setItem('ff2',JSON.stringify(S))}catch(e){toast('Não foi possível salvar. Faça um backup.')}};

function toast(m,fn){const t=$('toast');t.textContent=m;t.onclick=fn||null;t.style.pointerEvents=fn?'auto':'none';t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),fn?5000:2600)}

function num(s){
  s=String(s).replace(/[R$\s]/g,'');const neg=s.includes('-');s=s.replace(/[^\d.,]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=Math.round(parseFloat(s)*100);return isNaN(n)?0:(neg?-n:n);
}
const key=d=>norm(d).replace(/[^a-z ]/g,' ').trim().split(/\s+/)[0]||'';
function guess(desc,inc){
  const k=key(desc);if(S.rules[k])return S.rules[k];
  const n=norm(desc);
  if(inc)return /\bpj\b|nota fiscal|nf /.test(n)?'salario_pj':/salario|holerite/.test(n)?'salario':'extra';
  for(const [c,re] of KW)if(re.test(n))return c;
  return 'outros';
}

function stat(m){
  let inc=0,exp=0;const sp={};
  S.tx.forEach(t=>{if(!t.d.startsWith(m))return;if(t.t==='i')inc+=t.c;else{exp+=t.c;sp[t.cat]=(sp[t.cat]||0)+t.c}});
  const B=Object.values(S.bud).reduce((a,b)=>a+b,0),base=B||inc;
  return{inc,exp,sp,B,base,livre:base-exp};
}

function render(){
  const [y,mo]=M.split('-').map(Number),dim=new Date(y,mo,0).getDate(),cur=M===today().slice(0,7),day=new Date().getDate();
  $('mon').textContent=new Date(y,mo-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  const s=stat(M),pct=s.base>0?Math.min(100,s.exp/s.base*100):0;
  $('hero').innerHTML=s.base||s.exp
    ?`<div class="lb">${cur?'Livre até o fim do mês':'Sobrou no mês'}</div><div class="big ${s.livre<0?'neg':''}">${fmt(s.livre)}</div><div class="sub">${s.B?'do orçamento de '+fmt(s.B):'da renda do mês'}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="row"><span>Saídas ${fmt(s.exp)}</span><span>Entradas ${fmt(s.inc)}</span></div>`
    :`<div class="lb">Este mês ainda está vazio</div><div class="sub" style="margin-top:6px;font-size:14px;opacity:.9">Registre uma entrada na barra abaixo ou importe o extrato em Mais.</div>`;

  const over=[],pace=[];let ok=0;
  for(const k in CE){
    const b=S.bud[k]||0,sp=s.sp[k]||0;if(!b)continue;
    const id=M+k;
    if(sp>b){if(!S.dis[id])over.push({id,ic:CE[k][0],t:CE[k][1]+' passou do orçamento',s:fmt(sp)+' de '+fmt(b)+(cur?', com '+(dim-day)+' dias pela frente.':'.')})}
    else if(cur&&sp/b>day/dim+.2&&sp/b>.5){if(!S.dis[id])pace.push({id,ic:CE[k][0],t:CE[k][1]+' em ritmo alto',s:Math.round(sp/b*100)+'% do orçamento usado com '+Math.round(day/dim*100)+'% do mês.'})}
    else ok++;
  }
  const al=[...over,...pace].slice(0,3),att=$('att');
  att.hidden=!al.length&&!ok;
  att.innerHTML=(al.length?'<h2>Precisa da sua atenção</h2>'+al.map(a=>`<div class="al"><div class="ic">${a.ic}</div><div><b>${a.t}</b><small>${a.s}</small><br><button onclick="dis('${a.id}')">Entendi</button></div></div>`).join(''):'')
    +(ok?`<div class="row ok" style="margin-top:${al.length?4:0}px">✓ ${ok} ${ok>1?'categorias dentro':'categoria dentro'} do plano</div>`:'');

  const keys=Object.keys(CE).filter(k=>s.sp[k]||S.bud[k]);
  $('cats').hidden=!keys.length;
  $('cats').innerHTML='<h2>Por categoria</h2>'+keys.map(k=>{
    const sp=s.sp[k]||0,b=S.bud[k]||0,w=b?Math.min(100,sp/b*100):(s.exp?sp/s.exp*100:0);
    return `<div class="cat"><div class="row"><span>${CE[k][0]} ${CE[k][1]}</span><span>${fmt(sp)}${b?' / '+fmt(b):''}</span></div><div class="bar"><i style="width:${w}%;background:${b&&sp>b?'var(--rd)':'var(--bl)'}"></i></div></div>`;
  }).join('');

  const p=S.pend;
  $('pend').innerHTML=p&&p.d<today()?`<div class="card"><h2>No dia seguinte</h2>Você pensou em comprar: <b>${esc(p.desc)}</b> (${fmt(p.c)}). Um dia depois, ainda quer?<div class="acts"><button onclick="pendDone(1)">Ainda quero</button><button onclick="pendDone(0)">Desisti</button></div></div>`:'';
  renderList();
}

const opts=(type,sel)=>Object.entries(type==='i'?CI:CE).map(([k,v])=>`<option value="${k}"${k===sel?' selected':''}>${v[1]}</option>`).join('');
function renderList(){
  const q=norm($('search').value),l=S.tx.filter(t=>t.d.startsWith(M)&&(!q||norm(t.desc).includes(q))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
  $('list').innerHTML=l.length?l.map(t=>`<div class="tx"><div class="ti">${(ALL[t.cat]||ALL.outros)[0]}</div><div class="in"><div class="d">${esc(t.desc)}</div><div class="m">${t.d.slice(8)}/${t.d.slice(5,7)}<select onchange="setCat(${t.id},this.value)" aria-label="Categoria">${opts(t.t,t.cat)}</select></div></div><b class="${t.t==='i'?'gr':'rd'}">${t.t==='i'?'+':'-'} ${fmt(t.c)}</b><button class="x" onclick="del(${t.id})" aria-label="Remover">×</button></div>`).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>';
}

function shift(n){const [y,m]=M.split('-').map(Number),d=new Date(y,m-1+n,1);M=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
function setCat(id,c){const t=S.tx.find(x=>x.id===id);if(!t)return;t.cat=c;S.rules[key(t.desc)]=c;save();render();toast('Vou lembrar: '+(key(t.desc)||'esse tipo')+' vai para '+ALL[c][1])}
function del(id){const t=S.tx.find(x=>x.id===id);S.tx=S.tx.filter(x=>x.id!==id);save();render();toast('Removido. Toque para desfazer.',()=>{S.tx.push(t);save();render()})}
function dis(id){S.dis[id]=1;save();render()}

function quick(){
  const raw=$('q').value.trim();if(!raw)return;
  const m=raw.match(AMT);if(!m)return toast('Inclua o valor. Ex: mercado 240');
  const c=Math.abs(num(m[0]));if(!c)return toast('Valor inválido.');
  const inc=raw[0]==='+'||INC.test(norm(raw));
  const desc=raw.replace(m[0],'').replace(/^\+/,'').replace(/\breais\b/gi,'').replace(/\s+/g,' ').trim()||(inc?'Entrada':'Sem descrição');
  const cat=guess(desc,inc);
  S.tx.push({id:Date.now(),d:today(),desc,c,t:inc?'i':'o',cat});save();
  $('q').value='';M=today().slice(0,7);render();
  toast((inc?'Entrada':'Saída')+' de '+fmt(c)+' em '+ALL[cat][1]);
}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(!SR)$('mic').hidden=true;
$('mic').onclick=()=>{const r=new SR();r.lang='pt-BR';r.onresult=e=>{$('q').value=e.results[0][0].transcript;quick()};r.onerror=()=>toast('Não consegui ouvir. Tente de novo.');r.start();toast('Ouvindo…')};

function ask(){
  const n=$('pi').value.trim()||'Item',v=num($('pv').value);if(v<=0)return toast('Informe o valor.');
  const L=stat(today().slice(0,7)).livre;
  const k=v<=L*.4?['Pode ir','ok']:v<=L?['Cabe com custo','mid']:['Não recomendo agora','no'];
  ASK={desc:n,c:v};
  $('pr').innerHTML=`<b class="${k[1]}" style="font-size:16px">${k[0]}</b><div style="color:var(--mu);font-size:12px;margin-top:2px">${esc(n)} ${fmt(v)} contra ${fmt(L)} livres no mês</div><div class="acts"><button onclick="later()">Decidir amanhã</button><button onclick="$('pr').innerHTML=''">Desisti</button></div>`;
}
function later(){S.pend={...ASK,d:today()};save();$('pr').innerHTML='';toast('Pergunto de novo amanhã.')}
function pendDone(yes){toast(yes?'Registre a compra quando fizer.':'Boa decisão: '+fmt(S.pend.c)+' que ficaram no mês.');S.pend=null;save();render()}

/* Importação */
function parseCSV(t){
  const first=t.split('\n')[0],del=(first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',',rows=[];
  let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch==='"')q=true;
    else if(ch===del){r.push(c);c=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c);c='';if(r.some(x=>x.trim()))rows.push(r);r=[]}
    else c+=ch}
  r.push(c);if(r.some(x=>x.trim()))rows.push(r);return rows;
}
function pdt(s){
  s=String(s).trim();let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];
  m=s.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);if(m)return(m[3].length===2?'20'+m[3]:m[3])+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');return null;
}
function readFile(name,t){
  const it=[];
  if(/<STMTTRN>/i.test(t)){
    t.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const a=b.match(/<TRNAMT>\s*([-\d.,]+)/i),d=b.match(/<DTPOSTED>\s*(\d{4})(\d{2})(\d{2})/i),m=b.match(/<MEMO>\s*([^<\r\n]+)/i)||b.match(/<NAME>\s*([^<\r\n]+)/i);
      if(a&&d)it.push({d:d[1]+'-'+d[2]+'-'+d[3],desc:(m?m[1]:'Lançamento').trim(),v:Math.round(parseFloat(a[1].replace(',','.'))*100)});
    });
  }else{
    const rows=parseCSV(t),h=(rows[0]||[]).map(norm);
    const di=h.findIndex(x=>/data|date/.test(x)),vi=h.findIndex(x=>/valor|amount|value/.test(x)),ti=h.findIndex(x=>/descri|historico|lancamento|title|estabelecimento|memo|nome/.test(x));
    if(di<0||vi<0)return null;
    rows.slice(1).forEach(r=>{const d=pdt(r[di]),v=num(r[vi]);if(d&&v)it.push({d,desc:(r[ti>=0?ti:di+1]||'Lançamento').trim(),v})});
  }
  return it;
}
const dk=t=>t.d+'|'+t.c+'|'+norm(t.desc).replace(/[^a-z0-9]/g,'').slice(0,16);
function importItems(it){
  const neg=it.some(i=>i.v<0),seen=new Set(S.tx.map(dk));let n=0,dup=0,last='';
  it.forEach((i,k)=>{
    const inc=neg&&i.v>0,t={id:Date.now()+k,d:i.d,desc:i.desc,c:Math.abs(i.v),t:inc?'i':'o'};
    t.cat=guess(t.desc,inc);
    if(seen.has(dk(t))){dup++;return}
    seen.add(dk(t));S.tx.push(t);n++;if(t.d>last)last=t.d;
  });
  save();if(last)M=last.slice(0,7);render();
  toast(n+' importados'+(dup?', '+dup+' repetidos ignorados':'')+'.');
}
$('fi').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.arrayBuffer().then(b=>{
    let t=new TextDecoder('utf-8').decode(b);if(t.includes('\uFFFD'))t=new TextDecoder('iso-8859-1').decode(b);
    const it=readFile(f.name,t);
    if(!it)toast('Não achei as colunas de data e valor no arquivo.');
    else if(!it.length)toast('Nenhum lançamento encontrado.');
    else importItems(it);
  });e.target.value='';
};

/* Backup e exportação */
function dl(name,type,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function backup(){dl('financeflow-backup-'+today()+'.json','application/json',JSON.stringify(S));toast('Backup salvo.')}
$('fr').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{try{const o=JSON.parse(t);if(!Array.isArray(o.tx))throw 0;S={tx:[],bud:{},rules:{},dis:{},pend:null,...o};save();budInit();render();toast('Backup restaurado.')}catch(x){toast('Arquivo de backup inválido.')}});e.target.value='';
};
function exportCSV(){
  if(!S.tx.length)return toast('Nenhum lançamento para exportar.');
  const rows=S.tx.map(t=>`${t.d},"${t.desc.replace(/"/g,'""')}",${t.t==='i'?'Entrada':'Saída'},${(ALL[t.cat]||ALL.outros)[1]},${(t.c/100).toFixed(2)}`).join('\n');
  dl('financeflow_'+today()+'.csv','text/csv;charset=utf-8','\uFEFFData,Descrição,Tipo,Categoria,Valor (R$)\n'+rows);
}

/* Orçamentos e tema */
function budInit(){
  $('bud').innerHTML=Object.keys(CE).filter(k=>k!=='outros'||1).map(k=>`<label>${CE[k][0]} ${CE[k][1]}<input inputmode="decimal" data-k="${k}" placeholder="0,00" value="${S.bud[k]?(S.bud[k]/100).toFixed(2).replace('.',','):''}"></label>`).join('');
  $('bud').querySelectorAll('input').forEach(i=>i.onchange=()=>{const v=num(i.value);if(v>0)S.bud[i.dataset.k]=v;else delete S.bud[i.dataset.k];save();render()});
}
function dark(){const on=document.body.classList.toggle('dark');localStorage.setItem('ff_dark',on?'1':'0')}
if(localStorage.getItem('ff_dark')==='1')document.body.classList.add('dark');

budInit();render();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
